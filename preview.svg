<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">OmaWhy system scan preview</title>
  <desc id="desc">A faithful product preview of the OmaWhy Omarchy overlay running its system scan and listing real problems.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101018"/><stop offset="1" stop-color="#1c1323"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#272334"/><stop offset="1" stop-color="#16141f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#desktop)"/>
  <circle cx="1430" cy="110" r="230" fill="#e0228f" opacity=".14" filter="url(#soft)"/>
  <circle cx="120" cy="920" r="280" fill="#7f5af0" opacity=".12" filter="url(#soft)"/>

  <text x="78" y="92" fill="#f5f2ff" font-family="monospace" font-weight="700" font-size="31" letter-spacing="5">OMAWHY</text>
  <text x="78" y="130" fill="#b9b2c8" font-family="sans-serif" font-size="20">Pregunta qué hizo raro Omarchy: escanea el sistema o pregunta por algo puntual.</text>
  <text x="1320" y="95" fill="#e0228f" font-family="monospace" font-size="17" font-weight="700">SUPER + SHIFT + I</text>

  <!-- background desktop and selected app -->
  <rect x="68" y="177" width="965" height="684" rx="20" fill="#0a0a10" opacity=".76" stroke="#756e87" stroke-opacity=".35"/>
  <rect x="69" y="178" width="963" height="52" rx="20" fill="#312b3b" opacity=".95"/>
  <circle cx="104" cy="204" r="7" fill="#ff5d75"/><circle cx="128" cy="204" r="7" fill="#f6c45d"/><circle cx="152" cy="204" r="7" fill="#62d995"/>
  <text x="190" y="211" fill="#dcd7e8" font-family="sans-serif" font-size="18">Configuración de Hyprland</text>
  <rect x="94" y="253" width="910" height="568" rx="12" fill="#18151f"/>
  <rect x="94" y="253" width="910" height="62" rx="12" fill="#25202d"/>
  <rect x="124" y="272" width="392" height="27" rx="13" fill="#0e0c13"/>
  <text x="145" y="291" fill="#bdb6c8" font-family="monospace" font-size="15">~/.config/hypr/bindings.lua</text>
  <rect x="124" y="342" width="538" height="302" rx="10" fill="#312835"/>
  <text x="152" y="392" fill="#dcd7e8" font-family="monospace" font-size="16">o.bind("SUPER + SHIFT + R",</text>
  <text x="152" y="424" fill="#dcd7e8" font-family="monospace" font-size="16">  "Terminal", "exec, alacritty")</text>
  <text x="152" y="470" fill="#ff8ba0" font-family="monospace" font-size="16">-- alacritty no está instalado</text>
  <rect x="124" y="520" width="538" height="62" rx="10" fill="#2a2f1f"/>
  <text x="152" y="556" fill="#d8e0b0" font-family="monospace" font-size="15">source = ~/.local/share/omarchy/</text>
  <text x="152" y="580" fill="#d8e0b0" font-family="monospace" font-size="15">  default/hypr/autostart.conf</text>
  <rect x="124" y="673" width="528" height="21" rx="10" fill="#3a3341"/>
  <rect x="124" y="673" width="221" height="21" rx="10" fill="#e0228f"/>

  <!-- Dimmed selection state -->
  <rect x="68" y="177" width="965" height="684" rx="20" fill="#08070b" opacity=".46"/>
  <rect x="82" y="190" width="937" height="658" rx="16" fill="none" stroke="#e0228f" stroke-width="2" stroke-dasharray="8 8" opacity=".86"/>

  <!-- actual overlay card composition: system scan -->
  <g filter="url(#shadow)">
    <rect x="861" y="197" width="640" height="666" rx="18" fill="url(#glass)" stroke="#e0228f" stroke-width="2"/>
    <rect x="861" y="197" width="640" height="54" rx="18" fill="#3b2439" opacity=".7"/>
  </g>
  <text x="900" y="234" fill="#ff64b7" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">OMAWHY</text>
  <text x="900" y="286" fill="#fbf8ff" font-family="sans-serif" font-size="31" font-weight="700">Revisión del sistema</text>
  <text x="900" y="314" fill="#c9bdd0" font-family="sans-serif" font-size="16">Encontré 3 problemas que revisar.</text>
  <line x1="900" x2="1460" y1="334" y2="334" stroke="#84778f" stroke-opacity=".35"/>

  <!-- summary -->
  <rect x="900" y="352" width="560" height="44" rx="10" fill="#4a1f40" fill-opacity=".65" stroke="#e0228f" stroke-opacity=".8"/>
  <text x="920" y="380" fill="#f8f3fb" font-family="monospace" font-size="16" font-weight="700">3 errores · 9 avisos</text>

  <!-- problem list -->
  <rect x="900" y="414" width="560" height="110" rx="10" fill="#4a1a24" fill-opacity=".72" stroke="#e0705f" stroke-opacity=".75"/>
  <text x="918" y="442" fill="#ff9f92" font-family="monospace" font-size="14" font-weight="700">ERROR · Comando apunta a un ejecutable que no existe</text>
  <text x="918" y="466" fill="#f8f3fb" font-family="sans-serif" font-size="15">"alacritty" no está en el PATH. El atajo</text>
  <text x="918" y="488" fill="#f8f3fb" font-family="sans-serif" font-size="15">"SUPER + SHIFT + R" no va a funcionar.</text>
  <text x="918" y="512" fill="#ffb4de" font-family="sans-serif" font-size="14" font-weight="700">bindings.lua:16 · abrir archivo</text>

  <rect x="900" y="540" width="560" height="110" rx="10" fill="#4a1f40" fill-opacity=".6" stroke="#e0228f" stroke-opacity=".55"/>
  <text x="918" y="568" fill="#ff64b7" font-family="monospace" font-size="14" font-weight="700">ERROR · Comando apunta a un ejecutable que no existe</text>
  <text x="918" y="592" fill="#f8f3fb" font-family="sans-serif" font-size="15">"voxtype" no está en el PATH. El atajo</text>
  <text x="918" y="614" fill="#f8f3fb" font-family="sans-serif" font-size="15">"SUPER + H" no va a funcionar.</text>
  <text x="918" y="638" fill="#ffb4de" font-family="sans-serif" font-size="14" font-weight="700">bindings.lua:28 · abrir archivo</text>

  <rect x="900" y="666" width="560" height="90" rx="10" fill="#3f3747" fill-opacity=".8" stroke="#8f849b" stroke-opacity=".5"/>
  <text x="918" y="694" fill="#ffd27f" font-family="monospace" font-size="14" font-weight="700">OJO · Source a un archivo que no existe</text>
  <text x="918" y="718" fill="#f8f3fb" font-family="sans-serif" font-size="15">autostart.conf no se encuentra.</text>
  <text x="918" y="742" fill="#e0c9d6" font-family="sans-serif" font-size="14" font-weight="700">hyprland.conf:5 · abrir archivo</text>

  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <rect x="900" y="786" width="150" height="34" rx="8" fill="#e0228f"/><text x="975" y="808" fill="#1b1019" font-weight="700">Escanear otra vez</text>
    <rect x="1060" y="786" width="96" height="34" rx="8" fill="#3a3444"/><text x="1108" y="808" fill="#fff">Volver</text>
  </g>
  <text x="900" y="850" fill="#b7aebe" font-family="sans-serif" font-size="15">Cada hallazgo muestra archivo y línea. Revisa el escaneo tras arreglar un problema.</text>

  <text x="78" y="933" fill="#c3bacb" font-family="sans-serif" font-size="18">Diagnóstico de Omarchy · escaneo del sistema, ventanas, atajos y estado del escritorio</text>
  <text x="78" y="966" fill="#8f849b" font-family="monospace" font-size="15">evidencia real · archivo y línea · sin adivinar causas</text>
</svg>
